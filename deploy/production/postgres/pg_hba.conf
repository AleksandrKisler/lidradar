# Доступ к PostgreSQL production-стека LidRadar (ADR 0052). Подключается к серверу
# параметром hba_file (см. compose.yaml).
#
# Внутри контейнера (docker compose exec postgres psql …) вход по сокету без пароля:
# доступ к контейнеру равен доступу администратора хоста, на нём держатся scripts/backup.sh,
# restore.sh и bootstrap-roles.sh.
local   all   all                              trust
# По сети входят только два логина приложения и только с паролем. Администратор postgres
# по сети закрыт: даже известный пароль не откроет вход из соседнего контейнера.
host    all   lidradar,lidradar_runtime  all   scram-sha-256
host    all   all                        all   reject

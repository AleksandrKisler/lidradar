name: lidradar

x-backend-environment: &backend-environment
  LIDRADAR_ENV: development
  LIDRADAR_DATABASE_URL: postgres://lidradar:lidradar@postgres:5432/lidradar?sslmode=disable
  LIDRADAR_DATABASE_MAX_CONNS: "10"
  LIDRADAR_DATABASE_MIN_CONNS: "1"

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lidradar
      POSTGRES_USER: lidradar
      POSTGRES_PASSWORD: lidradar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lidradar -d lidradar"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - lidradar-postgres:/var/lib/postgresql

  migrate:
    build:
      <<: *backend-build
      args:
        COMMAND: migrate
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      <<: *backend-build
      args:
        COMMAND: api
    environment:
      <<: *backend-environment
      LIDRADAR_HTTP_ADDRESS: :8080
      LIDRADAR_PUBLIC_BASE_URL: ${LIDRADAR_PUBLIC_BASE_URL:-}
      LIDRADAR_INTEGRATION_ENCRYPTION_KEY: ${LIDRADAR_INTEGRATION_ENCRYPTION_KEY:-}
      LIDRADAR_TELEGRAM_BOT_USERNAME: ${LIDRADAR_TELEGRAM_BOT_USERNAME:-LidRadarDevBot}
      LIDRADAR_AI_MODEL_VERSION: ${LIDRADAR_AI_MODEL_VERSION:-lidradar-main-v1}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 20

  worker:
    build:
      <<: *backend-build
      args:
        COMMAND: worker
    environment:
      <<: *backend-environment
      LIDAR_TELEGRAM_TOKEN: ${LIDAR_TELEGRAM_TOKEN:-}
      LIDRADAR_TELEGRAM_BOT_USERNAME: ${LIDRADAR_TELEGRAM_BOT_USERNAME:-LidRadarDevBot}
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      <<: *backend-build
      args:
        COMMAND: scheduler
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  ai-agent:
    profiles: ["ai"]
    build:
      <<: *backend-build
      args:
        COMMAND: ai-agent
    environment:
      LIDRADAR_ENV: development
      LIDRADAR_AI_CLOUD_URL: http://api:8080
      LIDRADAR_AI_CREDENTIALS_FILE: /run/secrets/ai-node.json
      LIDRADAR_AI_PROVIDER: fake
      LIDRADAR_AI_MODEL_VERSION: ${LIDRADAR_AI_MODEL_VERSION:-lidradar-main-v1}
    volumes:
      - ${LIDRADAR_AI_CREDENTIALS_HOST_FILE:-./runtime/ai-node.json}:/run/secrets/ai-node.json:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  lidradar-postgres:

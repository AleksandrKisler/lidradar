<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" fill="none" role="img" aria-labelledby="title desc"><title id="title">Карточка риска · Состояния</title><desc id="desc">Загрузка, закрытый риск только для чтения, конфликт этапа и потеря права — четыре композиции. Демонстрационные данные. Макет для компьютера.</desc><rect x="0" y="0" width="1440" height="1180" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<g id="icon-radar-1" transform="translate(48 36) scale(1.0416666666666667)" fill="none" stroke="#6C55FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-2" x="82" y="55" font-family="Inter" font-size="21" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="140">LidRadar</text>
<text id="text-3" x="48" y="126" font-family="Inter" font-size="32" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="1300">Карточка риска · состояния</text>
<text id="text-4" x="48" y="160" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="1300">Каждое состояние — отдельная композиция; ошибка не маскируется под пустую карточку, успех не заявляется до ответа сервера.</text>
<rect x="48" y="208" width="652" height="440" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-5" x="72" y="242" font-family="Inter" font-size="17" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="604">Загрузка</text>
<text id="text-6" x="72" y="265" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="604">Скелет повторяет геометрию карточки, значений нет.</text>
<rect x="72" y="290" width="180" height="20" rx="8" fill="#E3E8F0" stroke="none" stroke-width="1"/>
<rect x="72" y="322" width="420" height="32" rx="8" fill="#E3E8F0" stroke="none" stroke-width="1"/>
<rect x="72" y="370" width="604" height="88" rx="8" fill="#E3E8F0" stroke="none" stroke-width="1"/>
<rect x="72" y="476" width="290" height="120" rx="8" fill="#E3E8F0" stroke="none" stroke-width="1"/>
<rect x="386" y="476" width="290" height="120" rx="8" fill="#E3E8F0" stroke="none" stroke-width="1"/>
<text id="text-7" x="72" y="626" font-family="Inter" font-size="11" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="600">role=&quot;status&quot; · aria-label=&quot;Загрузка карточки&quot;</text>
<rect x="740" y="208" width="652" height="440" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-8" x="764" y="242" font-family="Inter" font-size="17" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="604">Закрытый риск</text>
<text id="text-9" x="764" y="265" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="604">Команды скрыты, формы заменены пояснением; история читается.</text>
<rect x="764" y="290" width="92" height="28" rx="14" fill="#FFF6E8" stroke="none" stroke-width="1"/>
<text id="text-10" x="810" y="308" font-family="Inter" font-size="11" font-weight="600" fill="#AD5B11" text-anchor="middle" data-max-width="76">Высокий</text>
<rect x="862" y="290" width="220" height="28" rx="14" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<text id="text-11" x="972" y="308" font-family="Inter" font-size="11" font-weight="600" fill="#63718A" text-anchor="middle" data-max-width="204">Клиент молчит после цены</text>
<rect x="1090" y="290" width="96" height="28" rx="14" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<text id="text-12" x="1138" y="308" font-family="Inter" font-size="11" font-weight="600" fill="#63718A" text-anchor="middle" data-max-width="80">Закрыт</text>
<text id="text-13" x="764" y="350" font-family="Inter" font-size="24" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="560">Елена Волкова</text>
<text id="text-14" x="764" y="376" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="560">Керамическое покрытие · закрыт вчера, 18:40</text>
<rect x="764" y="404" width="604" height="70" rx="12" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-15" transform="translate(780 422) scale(0.8333333333333334)" fill="none" stroke="#1768C6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-16" x="812" y="434" font-family="Inter" font-size="13" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="538">Риск закрыт</text>
<text id="text-17" x="812" y="457" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="538">Действия и исходы больше не записываются. История и вердикт остаются доступны.</text>
<text id="text-18" x="764" y="516" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="300">История</text>
<text id="text-19" x="764" y="548" font-family="Inter" font-size="13" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="300">Исход · Записался</text>
<text id="text-20" x="1344" y="548" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="end" data-max-width="200">вчера, 18:30</text>
<text id="text-21" x="764" y="578" font-family="Inter" font-size="13" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="320">Действие · Позвонили клиенту</text>
<text id="text-22" x="1344" y="578" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="end" data-max-width="200">вчера, 17:50</text>
<rect x="48" y="672" width="652" height="440" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-23" x="72" y="706" font-family="Inter" font-size="17" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="604">Конфликт этапа (409)</text>
<text id="text-24" x="72" y="729" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="604">Сделку перевели раньше: список целей перечитан, успех не заявлен.</text>
<text id="text-25" x="72" y="754" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="106">Этап сделки</text>
<text id="text-26" x="186" y="754" font-family="Inter" font-size="13" font-weight="550" fill="#191E2B" text-anchor="start" data-max-width="186">Записан</text>
<text id="text-27" x="72" y="790" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="300">Перевести на этап</text>
<rect x="72" y="802" width="300" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-28" x="86" y="831" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="250">Выберите этап</text>
<g id="icon-chevron-down-29" transform="translate(341 816) scale(0.6666666666666666)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g>
<g id="button-30">
<rect x="392" y="802" width="130" height="46" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<text id="text-31" x="457" y="829.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="106">Перевести</text>
</g>
<rect x="72" y="868" width="604" height="72" rx="12" fill="#FFF6E8" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-32" transform="translate(88 886) scale(0.8333333333333334)" fill="none" stroke="#AD5B11" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-33" x="120" y="898" font-family="Inter" font-size="13" font-weight="600" fill="#AD5B11" text-anchor="start" data-max-width="538">Этап уже изменился</text>
<text id="text-34" x="120" y="921" font-family="Inter" font-size="12" font-weight="400" fill="#AD5B11" text-anchor="start" data-max-width="538">Сделку перевели раньше — список доступных этапов обновлён по данным сервера.</text>
<text id="text-35" x="72" y="978" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="600">Цели теперь: «Выиграна», «Потеряна» — назад дороги нет.</text>
<text id="text-36" x="72" y="1004" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="600">Запись в истории: Новая → Записан · AI · уверенность 87 %</text>
<rect x="740" y="672" width="652" height="440" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-37" x="764" y="706" font-family="Inter" font-size="17" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="604">Потеря права и неизвестный результат</text>
<text id="text-38" x="764" y="729" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="604">Сервер решает окончательно; клиент показывает состояние честно.</text>
<g id="icon-shield-check-39" transform="translate(764 742) scale(1.1666666666666667)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text id="text-40" x="764" y="806" font-family="Inter" font-size="20" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="560">Раздел недоступен</text>
<text id="text-41" x="764" y="836" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="596">У вашей роли нет доступа к этим настройкам.</text>
<text id="text-42" x="764" y="857" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="596">Кнопки исчезают после перечитывания сессии, а не по догадке.</text>
<line x1="764" y1="884" x2="1368" y2="884" stroke="#E1E7F0" stroke-width="1"/>
<rect x="764" y="902" width="604" height="86" rx="12" fill="#FFF6E8" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-43" transform="translate(780 920) scale(0.8333333333333334)" fill="none" stroke="#AD5B11" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-44" x="812" y="932" font-family="Inter" font-size="13" font-weight="600" fill="#AD5B11" text-anchor="start" data-max-width="538">Результат неизвестен</text>
<text id="text-45" x="812" y="954" font-family="Inter" font-size="12" font-weight="400" fill="#AD5B11" text-anchor="start" data-max-width="538">Сеть оборвалась после отправки. Повторите с тем же ключом:</text>
<text id="text-46" x="812" y="973" font-family="Inter" font-size="12" font-weight="400" fill="#AD5B11" text-anchor="start" data-max-width="538">сервер вернёт прежнюю запись, а не создаст вторую.</text>
<g id="button-47">
<rect x="764" y="1008" width="262" height="40" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<g id="icon-refresh-cw-48" transform="translate(780 1019) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text id="text-49" x="807" y="1032.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="206">Повторить тем же ключом</text>
</g>
<g id="button-50">
<rect x="1042" y="1008" width="122" height="40" rx="11" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-51" x="1103" y="1032.5" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="middle" data-max-width="98">Отмена</text>
</g>
<text id="text-52" x="48" y="1150" font-family="Inter" font-size="12" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="1340">Общие правила: pending блокирует повторную отправку · 409 → перечитать · 403 → перечитать сессию · неизвестный результат → повтор тем же ключом</text></svg>

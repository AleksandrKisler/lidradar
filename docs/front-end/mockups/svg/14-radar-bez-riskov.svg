<text id="text-30" x="836" y="611" font-family="Inter" font-size="27" font-weight="650" fill="#191E2B" text-anchor="middle" data-max-width="960">Не требуется срочных действий</text>
<text id="text-31" x="836" y="656" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="middle" data-max-width="940">Мы продолжаем проверять переписку.</text>
<text id="text-32" x="836" y="682" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="middle" data-max-width="940">Это не означает, что диалогов нет — только то, что сейчас нет активных рисков.</text>

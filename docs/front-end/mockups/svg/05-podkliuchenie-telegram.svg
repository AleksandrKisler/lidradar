<text id="text-26" x="484" y="391" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="650">Студия на Пресне · бизнес-аккаунт Telegram</text>
<text id="text-27" x="484" y="437" font-family="Inter" font-size="12" font-weight="500" fill="#087D50" text-anchor="start" data-max-width="620">Новые сообщения принимаются · проверено только что</text>

<text id="text-16" x="62" y="914" font-family="Inter" font-size="11" font-weight="400" fill="#A4B0C6" text-anchor="start" data-max-width="258">Самостоятельно клиентам не пишет.</text>
<text id="text-17" x="460" y="72" font-family="Inter" font-size="12" font-weight="600" fill="#5640D8" text-anchor="start" data-max-width="650">Шаг 4 из 4</text>
<text id="text-18" x="460" y="132" font-family="Inter" font-size="30" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="872">Подключите Telegram</text>
<text id="text-19" x="460" y="162" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="870">Два независимых подключения: переписка клиентов</text>

<text id="text-5" x="98" y="179" font-family="Inter" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="210">Компания</text>
<line x1="64" y1="200" x2="64" y2="232" stroke="#35405A" stroke-width="1"/>
<circle cx="64" cy="258" r="16" fill="#6C55FF" stroke="none" stroke-width="1"/>
<g id="icon-check-6" transform="translate(54 248) scale(0.8333333333333334)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g>
<text id="text-7" x="98" y="263" font-family="Inter" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="210">Рабочее время</text>
<line x1="64" y1="284" x2="64" y2="316" stroke="#35405A" stroke-width="1"/>
<circle cx="64" cy="342" r="16" fill="#6C55FF" stroke="none" stroke-width="1"/>
<text id="text-8" x="64" y="347" font-family="Inter" font-size="12" font-weight="650" fill="#FFFFFF" text-anchor="middle" data-max-width="24">3</text>
<text id="text-9" x="98" y="347" font-family="Inter" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="210">Услуги и цены</text>
<line x1="64" y1="368" x2="64" y2="400" stroke="#35405A" stroke-width="1"/>
<circle cx="64" cy="426" r="16" fill="#253048" stroke="none" stroke-width="1"/>
<text id="text-10" x="64" y="431" font-family="Inter" font-size="12" font-weight="650" fill="#FFFFFF" text-anchor="middle" data-max-width="24">4</text>
<text id="text-11" x="98" y="431" font-family="Inter" font-size="15" font-weight="600" fill="#9AA7BE" text-anchor="start" data-max-width="210">Telegram</text>
<rect x="40" y="758" width="300" height="182" rx="16" fill="#1B2436" stroke="none" stroke-width="1"/>
<g id="icon-shield-check-12" transform="translate(62 780) scale(0.9583333333333334)" fill="none" stroke="#AFA4FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text id="text-13" x="62" y="829" font-family="Inter" font-size="14" font-weight="500" fill="#E0E4EE" text-anchor="start" data-max-width="258">Вы управляете действиями.</text>
<text id="text-14" x="62" y="852" font-family="Inter" font-size="14" font-weight="500" fill="#E0E4EE" text-anchor="start" data-max-width="258">LidRadar помогает заметить</text>
<text id="text-15" x="62" y="875" font-family="Inter" font-size="14" font-weight="500" fill="#E0E4EE" text-anchor="start" data-max-width="258">риск и выбрать следующий шаг.</text>
<text id="text-16" x="62" y="914" font-family="Inter" font-size="11" font-weight="400" fill="#A4B0C6" text-anchor="start" data-max-width="258">Самостоятельно клиентам не пишет.</text>
<text id="text-17" x="460" y="72" font-family="Inter" font-size="12" font-weight="600" fill="#5640D8" text-anchor="start" data-max-width="650">Шаг 3 из 4</text>
<text id="text-18" x="460" y="132" font-family="Inter" font-size="30" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="872">Добавьте основные услуги</text>
<text id="text-19" x="460" y="162" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="870">Цены нужны для оценки потенциальной выручки.</text>
<text id="text-20" x="460" y="185" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="870">Если сумма неизвестна, мы не будем её придумывать.</text>
<rect x="460" y="225" width="888" height="422" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-21" x="484" y="259" font-family="Inter" font-size="17" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="840">Каталог услуг</text>
<text id="text-22" x="484" y="282" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="840">Для начала достаточно 2–3 основных услуг.</text>
<text id="text-23" x="484" y="330" font-family="Inter" font-size="10" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="400">УСЛУГА</text>
<text id="text-24" x="900" y="330" font-family="Inter" font-size="10" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="200">ЦЕНА</text>
<text id="text-25" x="484" y="371" font-family="Inter" font-size="14" font-weight="550" fill="#191E2B" text-anchor="start" data-max-width="385">Керамическое покрытие</text>
<text id="text-26" x="900" y="371" font-family="Inter" font-size="13" font-weight="500" fill="#191E2B" text-anchor="start" data-max-width="280">42 000 ₽</text>
<g id="icon-ellipsis-27" transform="translate(1288 356) scale(0.8333333333333334)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g>
<line x1="484" y1="393" x2="1324" y2="393" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-28" x="484" y="431" font-family="Inter" font-size="14" font-weight="550" fill="#191E2B" text-anchor="start" data-max-width="385">Полировка кузова</text>
<text id="text-29" x="900" y="431" font-family="Inter" font-size="13" font-weight="500" fill="#191E2B" text-anchor="start" data-max-width="280">31 000 ₽</text>
<g id="icon-ellipsis-30" transform="translate(1288 416) scale(0.8333333333333334)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g>
<line x1="484" y1="453" x2="1324" y2="453" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-31" x="484" y="491" font-family="Inter" font-size="14" font-weight="550" fill="#191E2B" text-anchor="start" data-max-width="385">Защитная плёнка</text>
<text id="text-32" x="900" y="491" font-family="Inter" font-size="13" font-weight="500" fill="#191E2B" text-anchor="start" data-max-width="280">от 50 000 до 90 000 ₽</text>
<g id="icon-ellipsis-33" transform="translate(1288 476) scale(0.8333333333333334)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g>
<line x1="484" y1="513" x2="1324" y2="513" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-34" x="484" y="551" font-family="Inter" font-size="14" font-weight="550" fill="#191E2B" text-anchor="start" data-max-width="385">Другие работы</text>
<text id="text-35" x="900" y="551" font-family="Inter" font-size="13" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="280">Не указана</text>
<g id="icon-ellipsis-36" transform="translate(1288 536) scale(0.8333333333333334)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></g>
<line x1="484" y1="573" x2="1324" y2="573" stroke="#E1E7F0" stroke-width="1"/>
<g id="button-37">
<rect x="484" y="584" width="182" height="44" rx="11" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-plus-38" transform="translate(500 597) scale(0.75)" fill="none" stroke="#191E2B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></g>
<text id="text-39" x="527" y="610.5" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="126">Добавить услугу</text>
</g>
<rect x="460" y="677" width="888" height="103" rx="12" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-40" transform="translate(476 695) scale(0.8333333333333334)" fill="none" stroke="#1768C6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-41" x="508" y="707" font-family="Inter" font-size="13" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="822">Диапазон не подменяет точную сумму</text>
<text id="text-42" x="508" y="729" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="822">Цена 50 000–90 000 ₽ не превращается автоматически в «70 000 ₽».</text>
<text id="text-43" x="508" y="748" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="822">В риске появится сумма, только когда для неё есть надёжное основание.</text>
<line x1="460" y1="905" x2="1348" y2="905" stroke="#E1E7F0" stroke-width="1"/>
<g id="button-44">
<rect x="460" y="930" width="122" height="44" rx="11" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-arrow-left-45" transform="translate(476 943) scale(0.75)" fill="none" stroke="#191E2B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></g>
<text id="text-46" x="503" y="956.5" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="66">Назад</text>
</g>
<text id="text-47" x="610" y="958" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="410">Настройки можно изменить позже</text>
<g id="button-48">

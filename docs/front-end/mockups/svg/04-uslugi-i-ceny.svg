<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" role="img" aria-labelledby="title desc"><title id="title">Первоначальная настройка · Услуги</title><desc id="desc">Цены точные, диапазон или неизвестны; неизвестная сумма не равна нулю. Демонстрационные данные. Макет для компьютера.</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="380" height="1024" rx="0" fill="#0E1422" stroke="none" stroke-width="1"/>
<g id="icon-radar-1" transform="translate(48 38) scale(1.0416666666666667)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-2" x="82" y="57" font-family="Inter" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" data-max-width="140">LidRadar</text>
<text id="text-3" x="48" y="126" font-family="Inter" font-size="11" font-weight="650" fill="#8D99B0" text-anchor="start" data-max-width="270">НАЧАЛО РАБОТЫ</text>

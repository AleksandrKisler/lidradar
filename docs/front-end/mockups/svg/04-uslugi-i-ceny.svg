<g id="icon-arrow-right-49" transform="translate(1162 943) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></g>
<text id="text-50" x="1189" y="956.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="146">Продолжить</text>
</g></svg>

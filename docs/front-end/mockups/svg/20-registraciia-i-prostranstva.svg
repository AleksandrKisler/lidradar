<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" role="img" aria-labelledby="title desc"><title id="title">Регистрация и выбор пространства</title><desc id="desc">Создание аккаунта без раскрытия занятости адреса и явный выбор организации при нескольких членствах. Демонстрационные данные. Макет для компьютера.</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<g id="icon-radar-1" transform="translate(32 21) scale(1.0416666666666667)" fill="none" stroke="#6C55FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-2" x="66" y="40" font-family="Inter" font-size="21" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="140">LidRadar</text>
<text id="text-3" x="1280" y="40" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="end" data-max-width="200">Мария Владелец</text>
<rect x="1300" y="16" width="108" height="32" rx="8" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-4" x="1354" y="37" font-family="Inter" font-size="12" font-weight="600" fill="#191E2B" text-anchor="middle" data-max-width="80">Выйти</text>
<rect x="96" y="120" width="600" height="800" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-5" x="128" y="178" font-family="Inter" font-size="28" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="540">Создать аккаунт</text>
<text id="text-6" x="128" y="212" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="540">Аккаунт личный: организацию вы создадите или получите</text>
<text id="text-7" x="128" y="234" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="540">по коду приглашения следующим шагом.</text>
<text id="text-8" x="128" y="268" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="536">Имя</text>
<rect x="128" y="280" width="536" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-9" x="142" y="309" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="508">Мария Владелец</text>
<text id="text-10" x="128" y="368" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="536">Электронная почта</text>
<rect x="128" y="380" width="536" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-mail-11" transform="translate(142 393) scale(0.75)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></g>
<text id="text-12" x="170" y="409" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="482">owner@example.test</text>
<text id="text-13" x="128" y="468" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="536">Пароль</text>
<rect x="128" y="480" width="536" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-lock-keyhole-14" transform="translate(142 493) scale(0.75)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></g>
<text id="text-15" x="170" y="509" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="482">••••••••••••••</text>
<text id="text-16" x="128" y="547" font-family="Inter" font-size="11" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="536">От 12 символов. Показать можно кнопкой справа.</text>
<g id="icon-eye-17" transform="translate(624 495) scale(0.8333333333333334)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
<rect x="128" y="584" width="536" height="82" rx="12" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-18" transform="translate(144 602) scale(0.8333333333333334)" fill="none" stroke="#1768C6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-19" x="176" y="614" font-family="Inter" font-size="13" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="470">Занятый адрес не раскрывается</text>
<text id="text-20" x="176" y="636" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="470">Если почта уже используется, вы увидите нейтральную</text>
<text id="text-21" x="176" y="655" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="470">подсказку войти или сменить адрес.</text>
<g id="button-22">
<rect x="128" y="700" width="536" height="44" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<text id="text-23" x="396" y="726.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="512">Создать аккаунт</text>
</g>
<text id="text-24" x="128" y="790" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="300">Уже есть аккаунт?</text>
<text id="text-25" x="664" y="790" font-family="Inter" font-size="14" font-weight="650" fill="#5640D8" text-anchor="end" data-max-width="120">Войти</text>
<rect x="744" y="120" width="600" height="800" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-26" x="776" y="178" font-family="Inter" font-size="26" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="540">Выберите рабочее пространство</text>
<text id="text-27" x="776" y="212" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="540">У вас несколько организаций. Данные каждой разделены:</text>
<text id="text-28" x="776" y="234" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="540">выберите, с какой работать сейчас.</text>
<rect x="776" y="270" width="536" height="74" rx="14" fill="#FFFFFF" stroke="#6C55FF" stroke-width="1"/>
<text id="text-29" x="800" y="301" font-family="Inter" font-size="16" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="380">Detail Lab</text>
<text id="text-30" x="800" y="324" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="380">Владелец</text>
<text id="text-31" x="1288" y="311" font-family="Inter" font-size="12" font-weight="650" fill="#5640D8" text-anchor="end" data-max-width="100">Текущее</text>
<rect x="776" y="362" width="536" height="74" rx="14" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-32" x="800" y="393" font-family="Inter" font-size="16" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="380">Сеть «Лак»</text>
<text id="text-33" x="800" y="416" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="380">Менеджер</text>
<rect x="776" y="470" width="536" height="86" rx="12" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-34" transform="translate(792 488) scale(0.8333333333333334)" fill="none" stroke="#1768C6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-35" x="824" y="500" font-family="Inter" font-size="13" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="470">Смена организации очищает кеш</text>
<text id="text-36" x="824" y="522" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="470">Запросы прежней организации отменяются и удаляются</text>
<text id="text-37" x="824" y="541" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="470">до выбора новой: на экране не смешиваются данные.</text>
<line x1="776" y1="588" x2="1312" y2="588" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-38" x="776" y="626" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="300">Нужно новое пространство?</text>
<text id="text-39" x="1312" y="626" font-family="Inter" font-size="14" font-weight="650" fill="#5640D8" text-anchor="end" data-max-width="220">Создать организацию</text>
<text id="text-40" x="776" y="662" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="300">Получили код от владельца?</text>
<text id="text-41" x="1312" y="662" font-family="Inter" font-size="14" font-weight="650" fill="#5640D8" text-anchor="end" data-max-width="220">Принять приглашение</text>
<rect x="776" y="700" width="536" height="180" rx="14" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<text id="text-42" x="800" y="730" font-family="Inter" font-size="16" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="480">Принять приглашение</text>
<text id="text-43" x="800" y="760" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="488">Код приглашения</text>
<rect x="800" y="772" width="488" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-44" x="814" y="801" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="460">e2e-invitation-code-xxxxxxxxxxxxxxxxxxxxxxx</text>
<g id="button-45">
<rect x="800" y="828" width="180" height="40" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<text id="text-46" x="890" y="852.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="156">Присоединиться</text>
</g>
<text id="text-47" x="996" y="853" font-family="Inter" font-size="11" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="290">Код действует 7 дней и один раз.</text></svg>

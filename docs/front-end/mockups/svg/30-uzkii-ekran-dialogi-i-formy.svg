<text id="text-71" x="187" y="520" font-family="Inter" font-size="10" font-weight="400" fill="#63718A" text-anchor="middle" data-max-width="300">Диалог: ширина 100 % − 2 rem, макс. 28 rem</text>
</g></g>
<text id="text-72" x="1080" y="236" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="312">Два состояния маршрута</text>
<text id="text-73" x="1080" y="258" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">До 1024 px маршрут диалогов показывает либо</text>
<text id="text-74" x="1080" y="276" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">список, либо переписку. «К списку» возвращает</text>
<text id="text-75" x="1080" y="294" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">к списку с сохранёнными фильтрами; на планшете</text>
<text id="text-76" x="1080" y="312" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">в альбомной ориентации и на компьютере —</text>
<text id="text-77" x="1080" y="330" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">разделённая раскладка.</text>
<text id="text-78" x="1080" y="410" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="312">Формы</text>
<text id="text-79" x="1080" y="432" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">Одна колонка, подписи всегда видны, ошибки</text>
<text id="text-80" x="1080" y="450" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">связаны через aria-describedby, кнопки 44 px</text>
<text id="text-81" x="1080" y="468" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">на всю ширину. Таблицы становятся</text>
<text id="text-82" x="1080" y="486" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">прокручиваемыми областями с именем.</text>
<text id="text-83" x="1080" y="566" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="312">Модальные окна</text>
<text id="text-84" x="1080" y="588" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">Reka Dialog: ширина 100 % − 2 rem, максимум 28</text>
<text id="text-85" x="1080" y="606" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">rem, ловушка фокуса, Escape закрывает, кроме</text>
<text id="text-86" x="1080" y="624" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">неделимой операции в состоянии ожидания; фокус</text>
<text id="text-87" x="1080" y="642" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">возвращается к триггеру.</text>
<text id="text-88" x="1080" y="740" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="312">Длинный контент</text>
<text id="text-89" x="1080" y="762" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">Длинные почты, названия и суммы переносятся</text>
<text id="text-90" x="1080" y="780" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">или получают break-all; полное значение</text>
<text id="text-91" x="1080" y="798" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="312">доступно в подсказке и копированием.</text>
<text id="text-92" x="48" y="1140" font-family="Inter" font-size="12" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="1340">Кадры 375 × 812 в масштабе 0,8. Все состояния проверяются e2e в профиле «mobile» (iPhone 13) и матрицей ширин в Chromium.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" fill="none" role="img" aria-labelledby="title desc"><title id="title">Состояния интерфейса</title><desc id="desc">Ошибка загрузки, истёкшая привязка, ограничение входа и отсутствие доступа. Демонстрационные данные. Макет для компьютера.</desc><rect x="0" y="0" width="1440" height="1180" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<g id="icon-radar-1" transform="translate(48 36) scale(1.0416666666666667)" fill="none" stroke="#6C55FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-2" x="82" y="55" font-family="Inter" font-size="21" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="140">LidRadar</text>
<text id="text-3" x="48" y="126" font-family="Inter" font-size="32" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="1310">Состояния, которые нельзя забыть</text>
<text id="text-4" x="48" y="160" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="1300">Готовые блоки для сборки страниц · текст объясняет, что произошло и что сделать дальше</text>
<rect x="48" y="208" width="652" height="369" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-wifi-off-5" transform="translate(76 241) scale(1.3333333333333333)" fill="none" stroke="#AD5B11" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></g>
<text id="text-6" x="76" y="316" font-family="Inter" font-size="22" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="596">Не удалось обновить данные</text>
<text id="text-7" x="76" y="358" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Последний успешный снимок: сегодня, 13:41.</text>
<text id="text-8" x="76" y="383" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Мы не заменяем прежние значения нулями.</text>
<rect x="76" y="422" width="596" height="82" rx="12" fill="#FFF6E8" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-9" transform="translate(92 440) scale(0.8333333333333334)" fill="none" stroke="#AD5B11" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-10" x="124" y="452" font-family="Inter" font-size="13" font-weight="600" fill="#AD5B11" text-anchor="start" data-max-width="530">Данные могут быть устаревшими</text>
<text id="text-11" x="124" y="475" font-family="Inter" font-size="12" font-weight="400" fill="#AD5B11" text-anchor="start" data-max-width="530">Проверьте подключение и повторите попытку.</text>
<g id="button-12">
<rect x="76" y="515" width="181" height="44" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<g id="icon-refresh-cw-13" transform="translate(92 528) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
<text id="text-14" x="119" y="541.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="125">Повторить</text>
</g>
<rect x="740" y="208" width="652" height="369" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-clock-15" transform="translate(768 241) scale(1.3333333333333333)" fill="none" stroke="#6C55FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g>
<text id="text-16" x="768" y="316" font-family="Inter" font-size="22" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="596">Ссылка на привязку истекла</text>
<text id="text-17" x="768" y="358" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Одноразовая ссылка больше не действует.</text>
<text id="text-18" x="768" y="383" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Создайте новую и откройте бота ещё раз.</text>
<rect x="768" y="422" width="596" height="82" rx="12" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-19" transform="translate(784 440) scale(0.8333333333333334)" fill="none" stroke="#1768C6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-20" x="816" y="452" font-family="Inter" font-size="13" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="530">Источник переписки не отключён</text>
<text id="text-21" x="816" y="475" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="530">Истечение ссылки касается только личных уведомлений.</text>
<g id="button-22">
<rect x="768" y="515" width="262" height="44" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<g id="icon-external-link-23" transform="translate(784 528) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></g>
<text id="text-24" x="811" y="541.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="206">Создать новую ссылку</text>
</g>
<rect x="48" y="609" width="652" height="369" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-lock-keyhole-25" transform="translate(76 642) scale(1.3333333333333333)" fill="none" stroke="#AD5B11" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></g>
<text id="text-26" x="76" y="717" font-family="Inter" font-size="22" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="596">Слишком много попыток входа</text>
<text id="text-27" x="76" y="759" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Повторите попытку через 58 секунд.</text>
<text id="text-28" x="76" y="784" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Проверьте электронную почту и пароль</text>
<text id="text-29" x="76" y="809" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">перед следующей попыткой.</text>
<rect x="76" y="877" width="596" height="44" rx="11" fill="#E5E8F0" stroke="none" stroke-width="1"/>
<text id="text-30" x="374" y="905" font-family="Inter" font-size="13" font-weight="600" fill="#63718A" text-anchor="middle" data-max-width="552">Войти через 58 с</text>
<rect x="740" y="609" width="652" height="369" rx="18" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-shield-check-31" transform="translate(768 642) scale(1.3333333333333333)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text id="text-32" x="768" y="717" font-family="Inter" font-size="22" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="596">Раздел недоступен</text>
<text id="text-33" x="768" y="759" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">У вашей роли нет доступа к этим настройкам.</text>
<text id="text-34" x="768" y="784" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">Для изменения параметров обратитесь</text>
<text id="text-35" x="768" y="809" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="592">к владельцу рабочего пространства.</text>
<g id="button-36">
<rect x="768" y="877" width="235" height="44" rx="11" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-arrow-left-37" transform="translate(784 890) scale(0.75)" fill="none" stroke="#191E2B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></g>
<text id="text-38" x="811" y="903.5" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="179">Вернуться в Radar</text>
</g>
<text id="text-39" x="48" y="1054" font-family="Inter" font-size="13" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="1310">Правила: не показывать чужие данные · не раскрывать наличие аккаунта · не маскировать ошибку под пустой список</text>
<text id="text-40" x="48" y="1090" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="1310">Таймер входа использует серверное время ожидания, а не фиксированную минуту.</text></svg>

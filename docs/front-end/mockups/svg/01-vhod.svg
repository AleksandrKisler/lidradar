<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" role="img" aria-labelledby="title desc"><title id="title">Вход в LidRadar</title><desc id="desc">Вход по электронной почте и паролю без неподдерживаемого восстановления пароля. Демонстрационные данные. Макет для компьютера.</desc><rect x="0" y="0" width="1440" height="1024" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<rect x="0" y="0" width="620" height="1024" rx="0" fill="#0E1422" stroke="none" stroke-width="1"/>
<g id="icon-radar-1" transform="translate(64 43) scale(1.0416666666666667)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-2" x="98" y="62" font-family="Inter" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" data-max-width="140">LidRadar</text>
<rect x="64" y="180" width="350" height="28" rx="14" fill="#F0EDFF" stroke="none" stroke-width="1"/>
<text id="text-3" x="239" y="198" font-family="Inter" font-size="11" font-weight="600" fill="#5640D8" text-anchor="middle" data-max-width="334">КОНТРОЛЬ ПОТЕРЯННЫХ ВОЗМОЖНОСТЕЙ</text>
<text id="text-4" x="64" y="302" font-family="Inter" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" data-max-width="500">Замечайте риски.</text>
<text id="text-5" x="64" y="363" font-family="Inter" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" data-max-width="500">Возвращайте</text>
<text id="text-6" x="64" y="424" font-family="Inter" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="start" data-max-width="500">клиентов.</text>
<text id="text-7" x="64" y="516" font-family="Inter" font-size="16" font-weight="400" fill="#B9C4D8" text-anchor="start" data-max-width="493">Переписка, причина риска и следующий шаг —</text>
<text id="text-8" x="64" y="543" font-family="Inter" font-size="16" font-weight="400" fill="#B9C4D8" text-anchor="start" data-max-width="493">в одном рабочем пространстве.</text>
<rect x="64" y="660" width="492" height="190" rx="18" fill="#1B2436" stroke="none" stroke-width="1"/>
<g id="icon-radar-9" transform="translate(88 686) scale(1.1666666666666667)" fill="none" stroke="#AFA3FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-10" x="133" y="708" font-family="Inter" font-size="18" font-weight="650" fill="#FFFFFF" text-anchor="start" data-max-width="380">Деньги требуют внимания</text>
<text id="text-11" x="88" y="764" font-family="Inter" font-size="14" font-weight="400" fill="#BCC7DA" text-anchor="start" data-max-width="420">Понятные причины вместо догадок.</text>
<text id="text-12" x="88" y="790" font-family="Inter" font-size="14" font-weight="400" fill="#BCC7DA" text-anchor="start" data-max-width="420">Решение и ответ клиенту остаются за вами.</text>
<text id="text-13" x="64" y="960" font-family="Inter" font-size="12" font-weight="400" fill="#8B99B0" text-anchor="start" data-max-width="470">LidRadar · Для малого бизнеса</text>
<text id="text-14" x="746" y="250" font-family="Inter" font-size="32" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="560">С возвращением</text>
<text id="text-15" x="746" y="285" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="545">Войдите в своё рабочее пространство</text>
<text id="text-16" x="746" y="352" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="560">Электронная почта</text>
<rect x="746" y="364" width="560" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-mail-17" transform="translate(760 377) scale(0.75)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></g>
<text id="text-18" x="788" y="393" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="506">owner@example.test</text>
<text id="text-19" x="746" y="454" font-family="Inter" font-size="12" font-weight="600" fill="#63718A" text-anchor="start" data-max-width="560">Пароль</text>
<rect x="746" y="466" width="560" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<g id="icon-lock-keyhole-20" transform="translate(760 479) scale(0.75)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/></g>
<text id="text-21" x="788" y="495" font-family="Inter" font-size="14" font-weight="400" fill="#191E2B" text-anchor="start" data-max-width="506">••••••••••••</text>
<g id="icon-eye-22" transform="translate(1270 481) scale(0.8333333333333334)" fill="none" stroke="#63718A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g>
<g id="button-23">
<rect x="746" y="569" width="560" height="44" rx="11" fill="#6C55FF" stroke="none" stroke-width="1"/>
<text id="text-24" x="1026" y="595.5" font-family="Inter" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" data-max-width="536">Войти</text>
</g>
<line x1="746" y1="656" x2="1306" y2="656" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-25" x="746" y="698" font-family="Inter" font-size="14" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="300">Впервые в LidRadar?</text>
<text id="text-26" x="1306" y="698" font-family="Inter" font-size="14" font-weight="650" fill="#5640D8" text-anchor="end" data-max-width="200">Создать аккаунт</text>
<rect x="746" y="754" width="560" height="105" rx="12" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<g id="icon-circle-help-27" transform="translate(762 772) scale(0.8333333333333334)" fill="none" stroke="#1768C6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></g>
<text id="text-28" x="794" y="784" font-family="Inter" font-size="13" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="494">Безопасный вход</text>
<text id="text-29" x="794" y="806" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="494">Данные организаций разделены.</text>
<text id="text-30" x="794" y="825" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="494">После входа доступны только ваши рабочие пространства.</text></svg>

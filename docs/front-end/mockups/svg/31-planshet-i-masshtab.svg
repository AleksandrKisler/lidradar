<g id="icon-radar-6" transform="translate(24 30) scale(1.0416666666666667)" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-7" x="58" y="49" font-family="Inter" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="start" data-max-width="140">LidRadar</text>
<text id="text-8" x="32" y="126" font-family="Inter" font-size="14" font-weight="400" fill="#BAC2D2" text-anchor="start" data-max-width="170">Radar</text>
<rect x="16" y="146" width="200" height="42" rx="10" fill="#1C2435" stroke="none" stroke-width="1"/>
<text id="text-9" x="32" y="176" font-family="Inter" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start" data-max-width="170">Диалоги</text>
<text id="text-10" x="32" y="226" font-family="Inter" font-size="14" font-weight="400" fill="#BAC2D2" text-anchor="start" data-max-width="170">Аналитика</text>
<text id="text-11" x="32" y="276" font-family="Inter" font-size="14" font-weight="400" fill="#BAC2D2" text-anchor="start" data-max-width="170">Интеграции</text>
<text id="text-12" x="32" y="326" font-family="Inter" font-size="14" font-weight="400" fill="#BAC2D2" text-anchor="start" data-max-width="170">Настройки</text>
<rect x="232" y="0" width="536" height="72" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text id="text-13" x="264" y="30" font-family="Inter" font-size="10" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="300">DETAIL LAB</text>
<text id="text-14" x="264" y="54" font-family="Inter" font-size="18" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="300">Диалоги</text>
<text id="text-15" x="264" y="120" font-family="Inter" font-size="24" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="470">Контекст для следующего шага</text>
<rect x="264" y="150" width="472" height="46" rx="10" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-16" x="290" y="178" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="300">Поиск по имени</text>
<rect x="264" y="214" width="472" height="72" rx="14" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-17" x="288" y="242" font-family="Inter" font-size="15" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="400">Дмитрий Соколов</text>
<text id="text-18" x="288" y="264" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="400">Сколько стоит полировка кузова?</text>
<rect x="264" y="298" width="472" height="72" rx="14" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-19" x="288" y="326" font-family="Inter" font-size="15" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="400">Елена Волкова</text>
<text id="text-20" x="288" y="348" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="400">Спасибо, а что входит в комплекс?</text>
<rect x="264" y="382" width="472" height="72" rx="14" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-21" x="288" y="410" font-family="Inter" font-size="15" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="400">Ольга Кузнецова</text>
<text id="text-22" x="288" y="432" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="400">Оплатила, чек отправила</text>
<rect x="264" y="480" width="472" height="140" rx="14" fill="#EDF6FF" stroke="none" stroke-width="1"/>
<text id="text-23" x="288" y="516" font-family="Inter" font-size="14" font-weight="600" fill="#1768C6" text-anchor="start" data-max-width="420">Переписка открывается как отдельное состояние</text>
<text id="text-24" x="288" y="544" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="420">На планшете двум колонкам тесно рядом с панелью:</text>
<text id="text-25" x="288" y="562" font-family="Inter" font-size="12" font-weight="400" fill="#1768C6" text-anchor="start" data-max-width="420">список и переписка чередуются, «К списку» возвращает.</text>
</g></g>
<g transform="translate(560 200) scale(0.62)">
<rect x="0" y="0" width="640" height="1024" rx="28" fill="#F5F7FB" stroke="#E1E7F0" stroke-width="2"/>

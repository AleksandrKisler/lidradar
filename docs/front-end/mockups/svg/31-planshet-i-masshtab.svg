<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" fill="none" role="img" aria-labelledby="title desc"><title id="title">Планшет 768 и масштаб 200 %</title><desc id="desc">Планшет: боковая панель и одна колонка содержимого; 200 % масштаба: таблицы прокручиваются внутри области, действия не скрываются. Демонстрационные данные. Макет для планшета и масштаба 200 %.</desc><rect x="0" y="0" width="1440" height="1180" rx="0" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<g id="icon-radar-1" transform="translate(48 36) scale(1.0416666666666667)" fill="none" stroke="#6C55FF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path d="M4 6h.01"/><path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path d="M12 18h.01"/><path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle cx="12" cy="12" r="2"/><path d="m13.41 10.59 5.66-5.66"/></g>
<text id="text-2" x="82" y="55" font-family="Inter" font-size="21" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="140">LidRadar</text>
<text id="text-3" x="48" y="126" font-family="Inter" font-size="30" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="1300">Планшет 768–1023 px и масштаб 200 %</text>
<text id="text-4" x="48" y="160" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="1300">Боковая панель 232 px появляется с 768 px; двухколоночные раскладки (диалоги, аналитика) — только с 1024 px.</text>
<g transform="translate(48 200) scale(0.62)">
<rect x="0" y="0" width="768" height="1024" rx="28" fill="#F5F7FB" stroke="#E1E7F0" stroke-width="2"/>
<clipPath id="clip-31-planshet-i-masshtab-5"><rect x="0" y="0" width="768" height="1024" rx="28"/></clipPath>
<g clip-path="url(#clip-31-planshet-i-masshtab-5)">

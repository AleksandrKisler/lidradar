<rect x="0" y="0" width="640" height="64" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text id="text-27" x="20" y="26" font-family="Inter" font-size="9" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="220">DETAIL LAB</text>
<text id="text-28" x="20" y="48" font-family="Inter" font-size="16" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="220">Команда</text>
<rect x="560" y="16" width="60" height="32" rx="8" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-29" x="590" y="37" font-family="Inter" font-size="12" font-weight="600" fill="#191E2B" text-anchor="middle" data-max-width="48">Меню</text>
<text id="text-30" x="20" y="112" font-family="Inter" font-size="26" font-weight="700" fill="#191E2B" text-anchor="start" data-max-width="600">Команда и доступ</text>
<rect x="20" y="140" width="600" height="540" rx="16" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-31" x="40" y="176" font-family="Inter" font-size="16" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="400">Участники компании</text>
<rect x="40" y="200" width="560" height="420" rx="0" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-32" x="56" y="226" font-family="Inter" font-size="11" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="500">Область прокрутки · role=&quot;region&quot; · tabindex=&quot;0&quot;</text>
<text id="text-33" x="56" y="262" font-family="Inter" font-size="9" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="200">СОТРУДНИК</text>
<text id="text-34" x="356" y="262" font-family="Inter" font-size="9" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="100">РОЛЬ</text>
<text id="text-35" x="460" y="262" font-family="Inter" font-size="9" font-weight="650" fill="#63718A" text-anchor="start" data-max-width="100">ДОСТУП</text>
<text id="text-36" x="56" y="302" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="290">Мария Владелец · вы</text>
<text id="text-37" x="356" y="302" font-family="Inter" font-size="12" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="100">Владелец</text>
<rect x="460" y="284" width="86" height="28" rx="14" fill="#ECFBF3" stroke="none" stroke-width="1"/>
<text id="text-38" x="503" y="302" font-family="Inter" font-size="11" font-weight="600" fill="#087D50" text-anchor="middle" data-max-width="70">Активен</text>
<line x1="56" y1="324" x2="584" y2="324" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-39" x="56" y="362" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="290">Анна Смирнова</text>
<text id="text-40" x="356" y="362" font-family="Inter" font-size="12" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="100">Менеджер</text>
<rect x="460" y="344" width="86" height="28" rx="14" fill="#ECFBF3" stroke="none" stroke-width="1"/>
<text id="text-41" x="503" y="362" font-family="Inter" font-size="11" font-weight="600" fill="#087D50" text-anchor="middle" data-max-width="70">Активен</text>
<line x1="56" y1="384" x2="584" y2="384" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-42" x="56" y="422" font-family="Inter" font-size="13" font-weight="600" fill="#191E2B" text-anchor="start" data-max-width="290">Пётр Бывший-Длиннофамильный</text>
<text id="text-43" x="356" y="422" font-family="Inter" font-size="12" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="100">Менеджер</text>
<rect x="460" y="404" width="96" height="28" rx="14" fill="#F5F7FB" stroke="none" stroke-width="1"/>
<text id="text-44" x="508" y="422" font-family="Inter" font-size="11" font-weight="600" fill="#63718A" text-anchor="middle" data-max-width="80">Отозван</text>
<line x1="56" y1="444" x2="584" y2="444" stroke="#E1E7F0" stroke-width="1"/>
<rect x="56" y="560" width="528" height="8" rx="4" fill="#E3E8F0" stroke="none" stroke-width="1"/>
<rect x="56" y="560" width="300" height="8" rx="4" fill="#B6BFD0" stroke="none" stroke-width="1"/>
<text id="text-45" x="56" y="596" font-family="Inter" font-size="11" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="500">Горизонтальная прокрутка внутри области, не страницы</text>
<text id="text-46" x="40" y="660" font-family="Inter" font-size="11" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="560">Кнопки действий остаются в строке; при отключённых кнопках область сама фокусируема.</text>
<rect x="20" y="700" width="600" height="120" rx="16" fill="#FFFFFF" stroke="#E1E7F0" stroke-width="1"/>
<text id="text-47" x="40" y="736" font-family="Inter" font-size="16" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="400">Приглашения</text>
<text id="text-48" x="40" y="770" font-family="Inter" font-size="13" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="400">Приглашений пока нет</text>
</g></g>
<text id="text-49" x="1000" y="236" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="392">Планшет 768–1023</text>
<text id="text-50" x="1000" y="258" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">Панель навигации закреплена слева, содержимое — одна</text>
<text id="text-51" x="1000" y="276" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">колонка. Диалоги: список и переписка чередуются как</text>
<text id="text-52" x="1000" y="294" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">отдельные состояния. Аналитика и карточка риска: секции</text>
<text id="text-53" x="1000" y="312" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">складываются вертикально.</text>
<text id="text-54" x="1000" y="392" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="392">200 % масштаба (640 CSS px при 1280)</text>
<text id="text-55" x="1000" y="414" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">Ширина области содержимого меньше 768: включается режим</text>
<text id="text-56" x="1000" y="432" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">телефона с «Меню». Таблицы шире области получают</text>
<text id="text-57" x="1000" y="450" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">собственную прокрутку с именем и фокусом; подписи полей и</text>
<text id="text-58" x="1000" y="468" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">кнопки не скрываются.</text>
<text id="text-59" x="1000" y="548" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="392">Проверка</text>
<text id="text-60" x="1000" y="570" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">Матрица ширин включает 640 px как имитацию 200 %: без</text>
<text id="text-61" x="1000" y="588" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">горизонтальной прокрутки страницы, действие видно, axe без</text>
<text id="text-62" x="1000" y="606" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">нарушений. Уменьшение движения: анимации и переходы 0,01</text>
<text id="text-63" x="1000" y="624" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">мс.</text>
<text id="text-64" x="1000" y="690" font-family="Inter" font-size="14" font-weight="650" fill="#191E2B" text-anchor="start" data-max-width="392">Что не проектируется</text>
<text id="text-65" x="1000" y="712" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">Отдельных макетов на 1024 и 1440 для планшета нет: с 1024</text>
<text id="text-66" x="1000" y="730" font-family="Inter" font-size="12" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="392">px действуют десктопные листы 06–28.</text>
<text id="text-67" x="48" y="1140" font-family="Inter" font-size="12" font-weight="500" fill="#63718A" text-anchor="start" data-max-width="1340">Кадры: 768 × 1024 в масштабе 0,62 и 640 × 1024 (200 % от 1280) в масштабе 0,62. Токены и компоненты те же, что на листе 16.</text></svg>
